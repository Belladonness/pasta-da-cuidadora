[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/privacidade"
  to = "https://pasta-da-cuidadora.pages.dev/privacidade/"
  status = 301
  force = true

[[redirects]]
  from = "/privacidade.html"
  to = "https://pasta-da-cuidadora.pages.dev/privacidade/"
  status = 301
  force = true

[[redirects]]
  from = "/contato"
  to = "https://pasta-da-cuidadora.pages.dev/contato/"
  status = 301
  force = true

[[redirects]]
  from = "/contato.html"
  to = "https://pasta-da-cuidadora.pages.dev/contato/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://pasta-da-cuidadora.pages.dev/:splat"
  status = 301
  force = true

